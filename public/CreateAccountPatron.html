<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkerHub – Create Account</title>
      <link rel="stylesheet" href="CreateAccVendorPatronStyle.css">

</head>

<body data-auth-role="patron">

  <div class="app">
    <!-- Go Back Button -->
    <button class="back-btn" type="button" onclick="window.location.href='signup.html'">
      ← Go Back
    </button>

  
    <div class="logo">
      
      <img src="img/Logo.png" alt="HawkerHub Logo" />
    </div>

    <!-- Center Form Panel -->
    <div class="panel-wrap">
      <div class="panel">
        <div class="panel-top">
          <button
            class="mini-back"
            type="button"
            onclick="window.location.href='signup.html'">
            ← Back to Selection
          </button>
        </div>

        <div class="panel-body">
          <div class="icon"><img src="img/avatars/patron.png"></div>
          <div class="title">Create Account</div>
          <div class="subtitle">Patron Registration</div>

          <div class="segmented" data-role="patron">
            <button class="active" id="tabSignUp" type="button">Sign Up</button>
            <button class="inactive" id="tabSignIn" type="button">Sign In</button>
        </div>

        <form id="patronRegisterForm">
          <!-- Scrollable inputs container -->
          <div class="form-scroll">
            <label for="name">Full Name</label>
            <input id="name" type="text" required  />

            <label for="email">Email Address</label>
            <input id="email" type="email" required />

            <label for="phone_number">Phone Number</label>
            <input id="phone_number" type="tel" required  />

            <label for="password">Password</label>
            <input id="password" type="password" required />

            
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" type="password" required />

            <button class="submit-btn" type="submit">
              Create
            </button>

            <button class="submit-btn" type="button" id="guestBtn">
            Continue as Guest
            </button>
          </div>
        </form>
        
        <div id="message"></div>

        </div>

        <div class="panel-footer">
          <div class="divider">More Methods</div>

      <button class="google-btn" type="button">
        <img src="img/google icon.png" alt="Google" class="google-icon">
        <span class="google-label"></span>
        <span class="google-spinner" aria-hidden="true"></span>
      </button>          
        </div>
      </div>
    </div>
  </div>

<script type="module" src="GoogleAuth.js"></script>
<script type="module" src="SignUpPatron.js"></script>
<script src="AuthenticationTabs.js" defer></script>
<script src="GuestLogin.js"></script>
</body>
</html>
