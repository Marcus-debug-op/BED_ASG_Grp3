<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HawkerHub Profile</title>
    
    <link rel="stylesheet" href="Profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="topnav.css">
</head>
<body>

    <header class="profile-header">

    </header>

    <main class="main-body">
        <div class="content-wrapper">
            <section class="edit-profile-card">
                <h1>Edit Profile</h1>
                <p class="edit-subtitle">Update your account details.</p>

                <div class="form-group">
                <label for="full_name">Full Name</label>
                <input id="full_name" type="text" required>
                </div>

                <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" disabled>
                </div>

                <div class="form-group">
                <label for="phone_number">Phone Number</label>

                <div class="phone-input-group">
                    <span class="phone-prefix">+65</span>
                    <input
                    id="phone_number"
                    type="tel"
                    maxlength="8"
                    placeholder="81112222"
                    required
                    >
                </div>
                </div>

                <div class="edit-actions">
                <button
                    type="button"
                    class="cancel-btn"
                    onclick="window.location.href='PatronProfile.html'">
                    Cancel
                </button>

                <button type="submit" class="save-btn">
                    Save Changes
                </button>
                </div>

                <p id="message"></p>
            </form>
        </section>
            
        
    <script type="module" src="navbar-init.js"></script>
    <script src="EditProfile.js"></script>       
</body>
</html>
