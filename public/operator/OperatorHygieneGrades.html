<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HawkerHub – Hygiene Grades</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="operator.css">
  <link rel="stylesheet" href="OperatorStalls.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="brand">
        <img src="/img/Logo.png" alt="HawkerHub logo" class="brand-logo">
        <div class="brand-info">
          <div class="brand-title">Operator Overview</div>
          <div class="brand-subtitle" id="operator-email">Loading account...</div>
        </div>
      </div>

      <nav class="nav-menu">
        <a class="nav-item" href="operator.html">Dashboard</a>
        <a class="nav-item" href="OperatorStalls.html">Stall Management</a>
        <a class="nav-item" href="OperatorRentalLease.html">Rental & Lease</a>
        <a class="nav-item" href="OperatorComplaintsPage.html">Complaints</a>
        <a class="nav-item active" href="OperatorHygieneGrades.html">Hygiene Grades</a>
        <a class="nav-item" href="operatorStallAssignments.html">Vendor Assignment</a>
        <button class="btn-danger" id="logoutBtn" type="button">Log Out</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <h1>Latest NEA Hygiene Grades</h1>
        <p class="subtitle">Most recent completed inspection for each stall, grouped by grade.</p>
      </header>

      <section class="card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Grade</th>
              <th>Number of Stalls</th>
            </tr>
          </thead>
          <tbody id="hygiene-grades">
            <tr><td colspan="2" class="text-muted-center">Loading...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="operator.js"></script>
  <script src="OperatorHygieneGrades.js"></script>
</body>
</html>
