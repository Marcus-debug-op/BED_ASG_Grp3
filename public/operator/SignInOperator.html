<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkerHub – Operator Portal</title>
  <link rel="stylesheet" href="/auth/SignInStyle.css">
  <script type="module" src="SignInOperator.js"></script>

</head>

<body data-auth-role="operator">
  <div class="app">
    <button class="back-btn" type="button" onclick="window.location.href='SignInAdmin.html'">← Go Back</button>

    <div class="logo">
      <img src="/img/logo.png" alt="HawkerHub Logo" />
    </div>

    <div class="panel-wrap">
      <div class="panel">
        <div class="panel-top">

        </div>

        <div class="panel-body">
          <div class="icon"><img src="/img/avatars/operator.png"></div>
          <div class="title">Operator Sign In</div>
          <div class="subtitle">Operator Portal</div>

          <div id="password-fields">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="Enter your email" />

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" />

            <label for="badgeId">Badge ID</label>
            <input id="badgeId" type="text" placeholder="Enter your badge ID" />

            <button class="submit" type="button" id="submitBtn">Sign In</button>
          </div>

          <div id="otp-step" style="display:none;">
            <label for="otp">Enter the 6-digit code sent to your email</label>
            <input id="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />

            <button class="submit" type="button" id="otpSubmitBtn">Verify &amp; Sign In</button>

            <p id="dev-otp-hint" style="display:none; font-size: 0.85em; opacity: 0.7; margin-top: 8px;"></p>
          </div>
        </div>

        <div class="panel-footer"></div>
      </div>
    </div>
  </div>
</body>
</html>
