
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Officer & Operator | HawkerHub</title>
    <link rel="stylesheet" href="/auth/SignUpStyle.css">

</head>

<body>
<div class="app">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='/auth/signup.html'">
            ← Go Back
        </button>

        <div class="logo">
          <img src="/img/Logo.png" alt="HawkerHub Logo">
        </div>
    </div>

    <div class="content">
        <!-- Officer Card -->
        <div class="card officer-card">


            <h2>As Officer</h2>
            <p>
                Oversee hawker centre operations, ensure compliance,
                and maintain quality standards across all stalls.
            </p>
            <div class="cta">
                <a href="/officer/SignInOfficer.html">Continue as Officer</a>
            </div>
        </div>

        <!-- Operator Card -->
        <div class="card operator-card">
            
            <h2>As Operator</h2>
            <p>
                Manage day-to-day hawker centre activities,
                coordinate with vendors, and ensure smooth operations.
            </p>
            <div class="cta">
                <a href="SignInOperator.html">Continue as Operator</a>
            </div>
        </div>
    </div>

    </div>
</div>       

    
</body>
</html>
