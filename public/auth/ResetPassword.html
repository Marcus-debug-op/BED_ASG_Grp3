<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkerHub – Reset Password</title>
  <link rel="stylesheet" href="SignInStyle.css">
</head>

<body>
  <div class="app">
    <button class="back-btn" type="button" onclick="window.location.href='SigninPatron.html'">← Go Back</button>

    <div class="logo">
      <img src="/img/Logo.png" alt="HawkerHub Logo" />
    </div>

    <div class="panel-wrap">
      <div class="panel">
        <div class="panel-top"></div>

        <div class="panel-body">
          <div class="title">Reset Password</div>
          <div class="subtitle">Choose a new password for your account.</div>

          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" placeholder="At least 8 characters" />

          <label for="confirmPassword">Confirm New Password</label>
          <input id="confirmPassword" type="password" placeholder="Re-enter your new password" />

          <button class="submit" type="button" id="submitBtn">Reset Password</button>

          <p id="formMsg" class="forgot-msg" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="ResetPassword.js"></script>
</body>
</html>
