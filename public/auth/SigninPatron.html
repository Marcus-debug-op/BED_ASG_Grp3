<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkerHub – Log In</title>
  <link rel="stylesheet" href="SignInStyle.css">
</head>

<body data-auth-role="patron">
  <div class="app">
    <button class="back-btn" type="button" onclick="window.location.href='/auth/signup.html'">← Go Back</button>

    <div class="logo">
      <img src="/img/Logo.png" alt="HawkerHub Logo" />
    </div>

    <div class="panel-wrap">  
      <div class="panel">
        <div class="panel-top">
        </div>

        <div class="panel-body">
          <div class="icon"><img src="/img/avatars/patron.png"></div>
          <div class="title">Sign In</div>
          <div class="subtitle">Patron Sign In</div>

          <div class="segmented" data-role="patron">
            <button class="inactive" id="tabSignUp" type="button">Sign Up</button>
            <button class="active" id="tabSignIn" type="button">Sign In</button>
          </div>

          <label for="email">Email Address</label>
          <input id="email" type="email" />

          <label for="password">Password</label>
          <input id="password" type="password" />

          <div style="text-align:right; margin-top:6px;">
            <a class="back-to-signin" href="ForgotPassword.html" style="font-size:13px;">Forgot Password?</a>
          </div>

          <button class="submit" type="button" id="submitBtn">Sign In</button>
          <button class="submit" type="button" id="guestBtn">Continue as Guest</button>
        </div>

        <div class="panel-footer">
          <div class="divider">More Methods</div>

          <button class="google-btn" type="button" onclick="window.location.href='/api/auth/google'">
            <img src="/img/google icon.png" alt="Google" class="google-icon">
            <span class="google-label">Sign in with Google</span>
            <span class="google-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="AuthenticationTabs.js" defer></script>
  <script src="GuestLogin.js"></script>
  <script type="module" src="SignInPatron.js"></script>
</body>
</html>
