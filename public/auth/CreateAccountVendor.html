<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="stylesheet" href="CreateAccVendorPatronStyle.css">
</head>

<body data-auth-role="vendor">

  <div class="app">
    <!-- Go Back Button -->
    <button class="back-btn" type="button" onclick="window.location.href='/auth/signup.html'">
      ← Go Back
    </button>

    
    <div class="logo">
      
      <img src="/img/logo.png" alt="HawkerHub Logo" />
    </div>

    <!-- Center Form Panel -->
    <div class="panel-wrap">
      <div class="panel">
        <div class="panel-top">
          <button
            class="mini-back"
            type="button"
            onclick="window.location.href='/auth/signup.html'">
            ← Back to Selection
          </button>
        </div>

        <div class="panel-body">
          <div class="icon"><img src="/img/avatars/vendor.png"></div>
          <div class="title">Create Account</div>
          <div class="subtitle">Vendor Registration</div>

         <div class="segmented" data-role="vendor">
          <button class="active" id="tabSignUp" type="button">Sign Up</button>
          <button class="inactive" id="tabSignIn" type="button">Sign In</button>
        </div>  

          <!-- Scrollable inputs container -->
          <form id="vendorRegisterForm">
            <div class="form-scroll">
              <label for="name">Full Name</label>
              <input id="name" type="text" required />

              <label for="email">Email Address</label>
              <input id="email" type="email" required />

              <label for="phone_number">Phone Number</label>
              <input id="phone_number" type="tel" required />

              <label for="password">Password</label>
              <input id="password" type="password" required />

              <label for="confirm_password">Confirm Password</label>
              <input id="confirm_password" type="password" required />

              <label for="hawker_centre_id">Hawker Centre</label>
              <select id="hawker_centre_id" required>
                <option value="">Select a hawker centre</option>
              </select>

              <label for="stall_name">Stall Name</label>
              <input id="stall_name" type="text" required />

              <label for="cuisine_type">Cuisine Type</label>
              <input id="cuisine_type" type="text" required />

              <label for="description">Stall Description</label>
              <textarea id="description"></textarea>

              <label for="unit_number">Unit Number</label>
              <input id="unit_number" type="text" placeholder="#01-12" required />

              <button class="submit-btn" type="submit">Create</button>
            </div>
          </form>

          <div id="message"></div>


        </div>
      </div>
    </div>
  </div>

<script src="CreateAccVendor.js"></script>
<script src="AuthenticationTabs.js" defer></script>
</body>
</html>
