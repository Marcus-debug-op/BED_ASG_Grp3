<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkerHub – Forgot Password</title>
  <link rel="stylesheet" href="SignInStyle.css">
</head>

<body>
  <div class="app">
    <button class="back-btn" type="button" onclick="history.back()">← Go Back</button>

    <div class="logo">
      <img src="/img/Logo.png" alt="HawkerHub Logo" />
    </div>

    <div class="panel-wrap">
      <div class="panel">
        <div class="panel-top"></div>

        <div class="panel-body">
          <div class="title">Forgot Password</div>
          <div class="subtitle">Enter the email on your account and we'll send you a reset link.</div>

          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="you@example.com" />

          <button class="submit" type="button" id="submitBtn">Send Reset Link</button>

          <p id="formMsg" class="forgot-msg" aria-live="polite"></p>
        </div>

        <div class="panel-footer">
          <div class="divider">Remembered your password?</div>
          <a class="back-to-signin" href="SigninPatron.html">Back to Patron Sign In</a>
          <a class="back-to-signin" href="SignInVendor.html">Back to Vendor Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script src="ForgotPassword.js"></script>
</body>
</html>
