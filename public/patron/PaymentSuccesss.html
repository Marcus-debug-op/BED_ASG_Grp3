<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Successful - HawkerHub</title>
    <link rel="stylesheet" href="PaymentSuccessStyles.css" />
    <link rel="stylesheet" href="/shared/topnav.css" />
  </head>

  <body>


    <section class="banner-wrap">
      <div class="banner">
        <div class="banner-left">
          <a class="continue" href="/patron/browsestalls.html">← Continue Shopping</a>

          <div class="mini">
            <div class="mini-icon" aria-hidden="true">
              <img src="/img/cart icon.png" alt="Cart" />
            </div>
            <div class="mini-text">
              <div class="mini-title">Your Cart</div>
              <div class="mini-sub">0 items</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Main success content -->
    <main class="success-wrap">
      <section class="success">
        <!-- Green circle check -->
        <div class="check-circle" aria-hidden="true">
          <img
            src="/img/check.png"
            alt="Payment Successful"
            class="success-icon"
          />
        </div>

        <div class="success-text">
          <div class="line">
            <strong>Order Queue Number:</strong>
            <span id="queueNumber" class="queue-number">--</span>
          </div>

          <div class="line bold">Payment Successful</div>

          <div class="line">
            <strong>Food will be ready within:</strong>
            <span class="time">15 mins</span>
          </div>
        </div>
      </section>
      <!-- BED-93: the full order receipt is rendered here by the script below -->
      <section class="receipt-wrap" id="receiptWrap">
        <p id="receiptLoading">Loading your receipt...</p>
      </section>

      <div class="success-actions">
        <a class="success-btn" href="/patron/history.html">View order history</a>
        <a class="success-btn ghost" href="/patron/browsestalls.html">Continue shopping</a>
      </div>
    </main>

    
    <script type="module" src="/shared/navbar-init.js"></script>
    <script src="/patron/paymentSuccess.js"></script>
  </body>
</html>
