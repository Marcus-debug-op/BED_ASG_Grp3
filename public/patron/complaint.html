<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Complaint</title>
    <link rel="stylesheet" href="/shared/topnav.css" />
    <link rel="stylesheet" href="complaint.css" />
</head>
<body class="complaint-page">

    <div class="page-wrapper">
        <a href="javascript:history.back()" class="btn-go-back"> ↩ Go Back</a>
        
        <div class="form-container">
            <div class="form-header-img">
                <div class="sub-header" id="default-header">
                     <h1 id="page-title">Complaint Form</h1>
                     <p id="stall-name-display">Loading stall info...</p>
                </div>
                <button class="close-modal-btn" onclick="history.back()">×</button>
            </div>

            <div class="form-body">

                <div class="input-group">
                    <label>What is this about?</label>
                    <select id="complaint-type" class="main-complaint">
                        <option value="Hygiene">Hygiene</option>
                        <option value="Service">Service</option>
                        <option value="Food Quality">Food Quality</option>
                        <option value="Overcharging">Overcharging</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label>State your complaint</label>
                    </div>
                    <textarea id="complaint-text" class="main-complaint" placeholder="Reason:&#10;Content:"></textarea>
                </div>

                <div class="input-group">
                    <label>Suggested Improvements</label>
                    <textarea id="improvement-text" class="improvement-input" placeholder="How can we do better?"></textarea>
                </div>

                <div class="submit-container">
                    <button id="submit-btn" class="btn-submit">Submit</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/shared/loadNavbar.js"></script>
    <script type="module" src="/shared/navbar-auth.js"></script>
    <script type="module" src="Complaint.js"></script>

</body>
</html>
