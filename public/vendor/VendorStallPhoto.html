<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HawkerHub – Stall Photo</title>
  <link rel="stylesheet" href="VendorAccount.css">
  <link rel="stylesheet" href="VendorStallPhoto.css">
  <link rel="stylesheet" href="/shared/topnav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <section class="banner">
    <div class="container">
      <div class="banner-tabs">
        <a href="/profile/VendorProfile.html">Profile</a>
        <a href="/vendor/VendorStallDetails.html" class="active">My Stalls</a>
        <a href="/vendor/VenderAccountRentalStatus.html">Rental</a>
        <a href="/vendor/VendorComplaints.html">Complaints</a>
      </div>

      <div class="banner-text">
        <h1>Stall Photo</h1>
        <p>Update the profile picture patrons see when browsing your stall</p>
      </div>
    </div>
  </section>

  <main class="container">
    <div class="toolbar">
      <div class="dropdown-container">
        <div class="dropdown-trigger">
          Menu <span class="dropdown-arrow">▾</span>
        </div>
        <ul class="dropdown-menu">
          <li><a href="VenderAccountRentalStatus.html">Rental Status</a></li>
          <li><a href="VendorStallPhoto.html" class="active">Stall Photo</a></li>
        </ul>
      </div>
    </div>

    <!-- BED-147 -->
    <section class="upload-section stall-photo-section">
      <label for="stallSelect" class="field-label">Stall</label>
      <select id="stallSelect" class="stall-select">
        <option value="">Loading your stalls...</option>
      </select>

      <div class="upload-box" id="uploadBox">
        <img id="stallImagePreview" class="stall-photo-preview" src="" alt="">
        <i class="fa-solid fa-camera camera-icon" id="cameraIcon"></i>
        <p id="uploadHint">Click to select a photo for the selected stall</p>
      </div>
      <input type="file" id="stallImageInput" accept="image/*" hidden>

      <button type="button" id="saveStallImageBtn" class="add-btn save-photo-btn" disabled>
        Save Photo
      </button>

      <p id="stallPhotoMsg" class="stall-photo-msg" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="/shared/navbar-init.js"></script>
  <script src="VendorStallPhoto.js"></script>

</body>
</html>
