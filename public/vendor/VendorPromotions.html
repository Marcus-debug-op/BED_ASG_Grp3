<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Promotions - HawkerHub</title>

  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="VendorPromotions.css" />
  <link rel="stylesheet" href="/shared/topnav.css"/>
</head>

<body>


  <main class="container promo-page">
    <!-- Top bar -->
    <div class="promo-topbar">
      <a class="promo-back" href="/vendor/VendorDashboard.html">← Back</a>
      <select id="stallSelect" class="promo-stall-select" hidden></select>
    </div>

    <section class="card promo-card">
      <h2 class="promo-heading">Create Promotion</h2>

      <form id="promoForm" class="promo-form">
        <input type="hidden" id="promoId">

        <div class="promo-row">
          <label for="code">Promo Code</label>
          <input id="code" required maxlength="50" placeholder="e.g. SAVE10" />
        </div>

        <div class="promo-row">
          <label for="description">Description</label>
          <input id="description" maxlength="255" placeholder="e.g. 10% off your order (optional)" />
        </div>

        <div class="promo-grid-2">
          <div class="promo-row">
            <label for="value">Discount (%)</label>
            <input id="value" type="number" min="1" max="100" step="0.01" required placeholder="e.g. 10" />
          </div>

          <div class="promo-row promo-row-inline">
            <label class="promo-checkbox">
              <input id="active" type="checkbox" checked />
              Active
            </label>
          </div>
        </div>

        <div class="promo-grid-2">
          <div class="promo-row">
            <label for="startDate">Start Date</label>
            <input id="startDate" type="date" required />
          </div>

          <div class="promo-row">
            <label for="endDate">End Date</label>
            <input id="endDate" type="date" required />
          </div>
        </div>

        <div class="promo-actions-row">
          <button class="btn-primary promo-save-btn" type="submit">Save Promotion</button>
          <button type="button" id="cancelEditBtn" class="promo-cancel-btn" hidden>Cancel Edit</button>
          <p id="promoMsg" class="promo-msg" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section class="card promo-card">
      <div class="promo-list-head">
        <h2 class="promo-heading">Your Promotions</h2>
        <span class="promo-hint">Tip: You can Edit or Toggle Active. Promotions are never deleted, only deactivated.</span>
      </div>

      <div id="promoList" class="promo-list"></div>
    </section>
  </main>

  <script src="VendorPromotions.js"></script>
  <script type="module" src="/shared/navbar-init.js"></script>

</body>
</html>
